name: xplan
description: AI 写作助手 - 智能润色、文章生成、多语言翻译
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP 请求
  http: ^1.1.0

  # 状态管理
  provider: ^6.1.1

  # 本地存储
  shared_preferences: ^2.2.2

  # 时间格式化
  intl: ^0.18.1

  # 图标
  cupertino_icons: ^1.0.6

  # 文件选择
  file_picker: ^8.0.0

  # 图片选择
  image_picker: ^1.0.7

  # URL 启动
  url_launcher: ^6.2.1

  # 本地路径
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
