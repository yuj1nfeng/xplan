name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xplan-web-${{ github.ref_name }}
          path: flutter_app/build/web/
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev

      - name: Create Linux platform if not exists
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../xplan-linux-x64-${{ github.ref_name }}.tar.gz *

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xplan-linux-${{ github.ref_name }}
          path: flutter_app/build/linux/x64/release/bundle/xplan-linux-x64-*.tar.gz
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Enable KVM
        run: |
          /usr/sbin/setenforce 0 || true
          /usr/bin/kvm-ok || true

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xplan-android-${{ github.ref_name }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Create macOS platform if not exists
        run: |
          if [ ! -d "macos" ]; then
            flutter create --platforms=macos .
          fi

      - name: Build macOS
        run: flutter build macos --release

      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          ln -s /Applications Applications
          hdiutil create -format UDZO -srcfolder XPlan.app -volname XPlan xplan-macos-${{ github.ref_name }}.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xplan-macos-${{ github.ref_name }}
          path: flutter_app/build/macos/Build/Products/Release/xplan-macos-*.dmg
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform if not exists
        run: |
          if [ ! -d "windows" ]; then
            flutter create --platforms=windows .
          fi

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP
        run: |
          cd build/windows/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../xplan-windows-${{ github.ref_name }}.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xplan-windows-${{ github.ref_name }}
          path: flutter_app/build/windows/runner/Release/xplan-windows-*.zip
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Enable iOS support
        run: flutter config --enable-ios

      - name: Create iOS platform if not exists
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xplan-ios-${{ github.ref_name }}
          path: flutter_app/build/ios/iphoneos/Runner.app
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-web, build-linux, build-android, build-macos, build-windows, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Notes
        run: |
          cat > release-notes.md << 'EOF'
          # XPlan ${{ github.ref_name }}

          ## 📦 下载

          - **Web**: [下载](artifacts/xplan-web-${{ github.ref_name }})
          - **Linux**: [下载](artifacts/xplan-linux-${{ github.ref_name }})
          - **Android**: [下载](artifacts/xplan-android-${{ github.ref_name }})
          - **macOS**: [下载](artifacts/xplan-macos-${{ github.ref_name }})
          - **Windows**: [下载](artifacts/xplan-windows-${{ github.ref_name }})
          - **iOS**: [下载](artifacts/xplan-ios-${{ github.ref_name }})

          ## 📝 更新日志

          自动构建版本

          ---
          *此版本由 GitHub Actions 自动构建*
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          body_path: release-notes.md
          generate_release_notes: true
